hotkey: "<cmd>+<shift>+space"
model: "small"
language: "ja"
device: "auto"
input_device: 1
input_sample_rate: "auto"
sample_rate: 16000
chunk_seconds: 3
debug_audio_path: "debug/last_recording.wav"
formatter:
  backend: "llm" # "rule" or "llm"
  remove_fillers: true
  add_punctuation: true
  fillers:
    - "あー"
    - "えっと"
    - "なんか"
    - "えー"
    - "あの"
    - "まあ"
    - "ちょっと待って"
  llm:
    prompt: |
      あなたは音声入力の確定テキストを整形する編集者です。
      Whisperの文字起こし結果を、意味を変えずに読みやすい日本語へ整えてください。
      フィラー、言い直し、余分な空白を削り、必要な句読点を補ってください。
      固有名詞、数値、コード、URLは推測で変更しないでください。
    backend: "auto"
    mlx_model: "mlx-community/gemma-4-e2b-it-4bit"
    gguf_repo_id: "mradermacher/gemma-4-E2B-it-GGUF"
    gguf_filename: "*Q4_K_M.gguf"
    max_tokens: 256
    temperature: 0.0
    n_ctx: 4096
    n_gpu_layers: -1
