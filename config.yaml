hotkey: "<cmd>+<shift>+space"
model: "small"
language: "ja"
device: "auto"
input_device: 1
input_sample_rate: "auto"
sample_rate: 16000
chunk_seconds: 3
debug_audio_path: "debug/last_recording.wav"
formatter:
  backend: "rule"
  remove_fillers: true
  add_punctuation: true
  fillers:
    - "あー"
    - "えっと"
    - "なんか"
    - "えー"
    - "あの"
    - "まあ"
    - "ちょっと待って"
  llm:
    endpoint: "http://localhost:1234/v1"
    model: "auto"
    prompt: ""
