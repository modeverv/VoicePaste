[project]
name = "voicepaste"
version = "0.1.0"
description = "Local Whisper push-to-talk clipboard transcription tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VoicePaste contributors" }]
dependencies = [
  "sounddevice",
  "numpy",
  "pynput",
  "rich",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
darwin-arm64 = ["mlx-whisper", "mlx-vlm", "huggingface-hub"]
llm-gguf = ["llama-cpp-python", "huggingface-hub"]
whisper = ["faster-whisper"]

[project.scripts]
voicepaste = "src.main:main"
voicepaste-gui = "src.gui:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"
